name: Validate Forkit passport

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-passport-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-example-passport:
    name: validate-example-passport
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the sample ModelPassport
        uses: ./.github/actions/validate-passport
        with:
          passport-path: examples/forkit-passport.model.json
