name: Session Receipt release checks
on:
  push:
    branches: [codex/session-receipt-hn-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-oss:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: '3.11'
            target: macos-arm64-py311
          - os: ubuntu-24.04
            python: '3.12'
            target: linux-x86_64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/radar-dev.lock
          python -m pip download --only-binary=:all: --require-hashes -r requirements/radar-runtime.lock --dest output/wheelhouse
      - name: Core and Radar tests
        env:
          PYTHONPATH: src:packages/radar/src
        run: python -m pytest --import-mode=importlib tests packages/radar/tests scripts/tests -q
      - name: Build both local wheels and offline bundle
        run: |
          python -m build --wheel --no-isolation --outdir output/dist .
          python -m build --wheel --no-isolation --outdir output/dist packages/radar
          python scripts/build_radar_bundle.py --project-wheels output/dist --wheelhouse output/wheelhouse --output output/forkit-session-receipt-0.1.0b3-${{ matrix.target }}.zip
      - name: Install and try without a Forkit account
        run: |
          python scripts/check_radar_public_bundle.py output/forkit-session-receipt-0.1.0b3-${{ matrix.target }}.zip --output output/install-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: session-receipt-${{ matrix.target }}
          path: |
            output/forkit-session-receipt-*.zip
            output/dist/*.whl
            output/install-check.json
  aggregate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-local-ci-only
          POSTGRES_DB: forkit_p11_hn_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d forkit_p11_hn_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: packages/radar/collector
      - run: npm test
        working-directory: packages/radar/collector
        env:
          RADAR_TEST_DATABASE_URL: postgresql://postgres:fixture-local-ci-only@127.0.0.1:5432/forkit_p11_hn_ci
