[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "forkit-radar"
version = "0.1.0b6"
description = "Local evidence and continuity contracts for Forkit Radar"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "forkit-core==0.1.0",
  "pydantic==2.13.5",
  "rfc8785==0.1.4",
  "cryptography==50.0.1",
  "psutil==7.2.2",
  "packaging==26.3",
  "tomli==2.4.1; python_version < '3.11'",
]

[project.scripts]
forkit-radar = "forkit_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forkit_radar"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CAPTURE.md", "MACOS.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
